kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# 클러스터 이름 (선택 사항)
name: local-k8s

# 노드 설정
nodes:
  # 컨트롤 플레인 노드 설정
  - role: control-plane
    # 포트 매핑 설정 (선택 사항)
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    # 볼륨 마운트 설정
    # extraMounts:
    #   - hostPath: "/e/docker_volumn/control-plane"
    #     containerPath: /data
    # 노드 이미지 설정 (선택 사항, 특정 쿠버네티스 버전 지정)
    # image: kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245

  # 워커 노드 1 설정
  - role: worker
    # 노드 레이블 설정 (선택 사항)
    # labels:
    #   node-role.kubernetes.io/worker: ""
    #   environment: production
    # extraMounts:
    #   - hostPath: "/e/docker_volumn/worker1"
    #     containerPath: /data

  # 워커 노드 2 설정
  - role: worker
    # extraMounts:
    #   - hostPath: "/e/docker_volumn/worker2"
    #     containerPath: /data

# 네트워킹 설정
networking:
  # 파드 서브넷 설정
  podSubnet: "10.244.0.0/16"
  # 서비스 서브넷 설정
  serviceSubnet: "10.96.0.0/12"
  # API 서버 주소 설정 (내부 IP 사용)
  apiServerAddress: "192.168.0.7"  # 여기에 호스트 머신의 내부 IP 주소 입력
  apiServerPort: 6443

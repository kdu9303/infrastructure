# ============================================================================
# Spark 메모리 설정
# ============================================================================
# Spark 드라이버(마스터)의 메모리 할당량
spark.driver.memory 4g

# 각 Executor(워커)의 메모리 할당량
spark.executor.memory 2g

# 각 Executor가 사용할 CPU 코어 수
spark.executor.cores 2

# 실행할 Executor의 개수
spark.executor.instances 2

# ============================================================================
# 메모리 관련 설정
# ============================================================================
# Spark 실행 메모리와 저장 메모리의 전체 비율 (0.8 = 힙 메모리의 80%를 Spark가 사용)
spark.memory.fraction 0.8

# 실행 메모리 대비 저장 메모리의 비율 (0.3 = 전체 메모리의 30%를 캐시/영속화에 사용)
spark.memory.storageFraction 0.3

# ============================================================================
# 네트워크 설정
# ============================================================================
# 네트워크 작업의 기본 타임아웃 시간
spark.network.timeout 800s

# RPC(원격 프로시저 호출) 메시지의 최대 크기 (MB 단위)
spark.rpc.message.maxSize 256

# RPC 통신 실패 시 최대 재시도 횟수
spark.rpc.io.maxRetries 3

# 네트워크 연결 실패 시 최대 재시도 횟수
spark.network.maxRetries 3

# 직접 메모리 버퍼 사용 여부 (성능 향상을 위해 활성화)
spark.network.io.preferDirectBufs true

# RPC 룩업 작업의 타임아웃 시간
spark.rpc.lookupTimeout 120s

# 네트워크 서버 측 처리 스레드 수
spark.network.io.serverThreads 8

# 네트워크 클라이언트 측 처리 스레드 수
spark.network.io.clientThreads 8

# 피어당 최대 동시 연결 수
spark.network.io.numConnectionsPerPeer 1

# 네트워크 연결 대기 큐의 최대 크기
spark.network.io.backLog 128

# ============================================================================
# 기타 성능 설정
# ============================================================================
# 데이터 직렬화에 사용할 클래스 (Kryo는 기본 Java 직렬화보다 더 효율적)
spark.serializer org.apache.spark.serializer.KryoSerializer

# Kryo 직렬화 버퍼의 최대 크기
spark.kryoserializer.buffer.max 128m

# 드라이버가 모든 파티션으로부터 수집할 수 있는 결과의 최대 크기
spark.driver.maxResultSize 2g

# ============================================================================
# 이벤트 로그 설정
# ============================================================================
# Spark 이벤트 로깅 활성화 여부
spark.eventLog.enabled true

# Spark 이벤트 로그 저장 경로
spark.eventLog.dir /opt/spark/spark-events

# Spark 히스토리 서버가 읽을 로그 디렉토리 경로
spark.history.fs.logDirectory /opt/spark/spark-events

# ============================================================================
# 안정성 설정
# ============================================================================
# 느린 태스크에 대한 추측 실행 비활성화 (리소스 절약)
spark.speculation false

# 태스크 실패 허용 횟수
spark.task.maxFailures 2

# 스테이지 연속 실패 허용 횟수
spark.stage.maxConsecutiveAttempts 2

# ============================================================================
# 클래스패스 설정
# ============================================================================
# 드라이버와 실행기의 클래스패스 설정
spark.driver.extraClassPath /opt/spark/jars/*
spark.executor.extraClassPath /opt/spark/jars/*

# ============================================================================
# Iceberg 확장 및 카탈로그 설정
# ============================================================================
# Iceberg 세션 확장 설정
spark.sql.extensions                               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# 기본 카탈로그 설정
spark.sql.defaultCatalog                           local

# Spark 카탈로그 설정 (Hive 메타스토어 사용)
spark.sql.catalog.spark_catalog                    org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type               hive
spark.sql.catalog.spark_catalog.io-impl            org.apache.iceberg.aws.s3.S3FileIO

# 로컬 카탈로그 설정 (S3/MinIO 사용)
spark.sql.catalog.local                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local.type                       hadoop
spark.sql.catalog.local.warehouse                  s3a://minio:9000/warehouse/
spark.sql.catalog.local.io-impl                    org.apache.iceberg.aws.s3.S3FileIO

# ============================================================================
# S3/MinIO 설정
# ============================================================================
# 인증 정보
spark.hadoop.fs.s3a.access.key                     admin
spark.hadoop.fs.s3a.secret.key                     admin1234
spark.hadoop.fs.s3a.endpoint                       http://minio1:9000
spark.hadoop.fs.s3a.path.style.access              true
spark.hadoop.fs.s3a.impl                           org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider       org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# S3 성능 및 안정성 설정
spark.hadoop.fs.s3a.connection.timeout             120000
spark.hadoop.fs.s3a.connection.maximum             100
spark.hadoop.fs.s3a.attempts.maximum               10
spark.hadoop.fs.s3a.connection.establish.timeout   30000
spark.hadoop.fs.s3a.socket.timeout                 120000
spark.hadoop.fs.s3a.retry.limit                    10
spark.hadoop.fs.s3a.retry.interval                 1000ms
spark.hadoop.fs.s3a.multipart.size                 64M
spark.hadoop.fs.s3a.fast.upload                    true
spark.hadoop.fs.s3a.fast.upload.buffer             disk
spark.hadoop.fs.s3a.block.size                     32M
spark.hadoop.fs.s3a.committer.magic.enabled        false
spark.hadoop.fs.s3a.committer.name                 directory
spark.hadoop.fs.s3a.committer.staging.conflict-mode replace
spark.hadoop.fs.s3a.committer.staging.tmp.path     /tmp/spark_staging
spark.hadoop.fs.s3a.buffer.dir                     /tmp/spark_s3a_buffer
spark.hadoop.fs.s3a.checksum.enabled               true

# ============================================================================
# Iceberg 성능 최적화 설정
# ============================================================================
# 메모리 및 셔플 설정
spark.sql.shuffle.partitions                       200
spark.default.parallelism                          200

# 네트워크 타임아웃 설정
spark.executor.heartbeatInterval                   60s
spark.storage.blockManagerSlaveTimeoutMs           300000
spark.rpc.askTimeout                               300s

# ============================================================================
# Iceberg 테이블 작업 최적화 설정
# ============================================================================
# 벡터화된 읽기 활성화
spark.sql.parquet.enableVectorizedReader           true
spark.sql.parquet.batchSize                        10000

# 파티션 진화 지원
spark.sql.iceberg.planning.preserve-data-grouping  true

# 동시 작업 설정
spark.sql.iceberg.max-concurrent-operations        5

# 파일 크기 최적화
spark.sql.iceberg.target-file-size-bytes           134217728  # 128MB

# 메타데이터 테이블 설정
spark.sql.iceberg.metadata.refresh-max-retries     3
spark.sql.iceberg.metadata.refresh-max-wait-ms     3000

# AWS 리전 설정 추가
spark.driver.extraJavaOptions -Daws.region=us-east-1 -Daws.s3.path.style.access=true
spark.executor.extraJavaOptions -Daws.region=us-east-1 -Daws.s3.path.style.access=true
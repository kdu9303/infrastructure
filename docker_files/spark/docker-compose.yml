# docker-compose build
# docker-compose up --scale spark-worker=2

# entrypoint 설정을 앵커로 정의
x-entrypoint-master: &entrypoint-master
  entrypoint: ['/opt/spark/entrypoint.sh', 'master', '${SPARK_CONFIG_TYPE:-default}']
  # remote hive metastore 설정 사용
  # entrypoint: ['/opt/spark/entrypoint.sh', 'master', '${SPARK_CONFIG_TYPE:-hive}']

x-entrypoint-worker: &entrypoint-worker
  entrypoint: ['/opt/spark/entrypoint.sh', 'worker', '${SPARK_CONFIG_TYPE:-default}']
  # entrypoint: ['/opt/spark/entrypoint.sh', 'worker', '${SPARK_CONFIG_TYPE:-hive}']
x-entrypoint-history: &entrypoint-history
  entrypoint: ['/opt/spark/entrypoint.sh', 'history']

x-entrypoint-jupyter: &entrypoint-jupyter
  entrypoint: ['/opt/spark/entrypoint.sh', 'jupyter', '${SPARK_CONFIG_TYPE:-default}']
  # entrypoint: ['/opt/spark/entrypoint.sh', 'jupyter', '${SPARK_CONFIG_TYPE:-hive}']

services:
  spark-master:
    container_name: spark-master
    build: .
    image: spark-image
    restart: unless-stopped
    # entrypoint: ['/opt/spark/entrypoint.sh', 'master']
    <<: *entrypoint-master  # 마스터 entrypoint 앵커 참조
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 5s
      timeout: 3s
      retries: 2
    volumes:
      - ./book_data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
      - spark-logs:/opt/spark/spark-events
    env_file:
      - .env.spark
    environment:
      # RPC(원격 프로시저 호출) 처리를 위한 스레드 풀 크기
      - SPARK_RPC_IO_THREADS=16
      # 네트워크 I/O 작업을 처리하는 스레드 풀 크기
      - SPARK_NETWORK_IO_THREADS=16
      # RPC 통신에서 허용되는 최대 메시지 크기 (MB)
      - SPARK_RPC_MESSAGE_MAX_SIZE=256
      # 네트워크 연결 실패 시 재시도 횟수
      - SPARK_NETWORK_MAX_RETRIES=3
      # Spark 임시 파일 저장 위치 (셔플, 캐시 등)
      - SPARK_LOCAL_DIR=/tmp/spark-temp
      # REST 서비스 활성화 (클러스터 모드 지원)
      - SPARK_MASTER_REST_ENABLED=true
      - SPARK_MASTER_OPTS=-Dspark.deploy.recoveryMode=FILESYSTEM -Dspark.deploy.recoveryDirectory=/opt/spark/recovery
    ports:
      - '9090:8080'  # Spark 마스터 웹 UI 포트
      - '7077:7077'  # Spark 마스터 통신 포트
      - '16066:6066'  # Spark REST 서비스 포트 (6066 대신 16066 사용)
    networks:
      - minio_network
    ulimits:
      nofile:
        soft: 65536  # 파일 디스크립터 제한 (소프트)
        hard: 65536  # 파일 디스크립터 제한 (하드)

  jupyter-notebook:
    container_name: jupyter-notebook
    image: spark-image
    restart: unless-stopped
    <<: *entrypoint-jupyter  # 주피터 entrypoint 앵커 참조
    depends_on:
      - spark-master
    env_file:
      - .env.spark
    environment:
      # Jupyter 노트북 접속 토큰
      - JUPYTER_TOKEN=spark
      # Spark 설정 (마스터 노드와 동일한 설정 공유)
      - SPARK_RPC_IO_THREADS=16
      - SPARK_NETWORK_IO_THREADS=16
      - SPARK_RPC_MESSAGE_MAX_SIZE=256
      # Jupyter 설정
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_PORT=8888
    volumes:
      - ./notebooks:/opt/spark/notebooks
      - ./book_data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
    ports:
      - '8888:8888'  # Jupyter 노트북 웹 UI 포트
    networks:
      - minio_network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  spark-history-server:
    container_name: spark-history
    image: spark-image
    restart: unless-stopped
    <<: *entrypoint-history  # 히스토리 서버 entrypoint 앵커 참조
    depends_on:
      - spark-master
    env_file:
      - .env.spark
    volumes:
      - spark-logs:/opt/spark/spark-events  # Spark 이벤트 로그 저장소
    ports:
      - '18080:18080'  # Spark 히스토리 서버 웹 UI 포트
    networks:
      - minio_network

  spark-worker:
    image: spark-image
    restart: unless-stopped
    <<: *entrypoint-worker  # 워커 entrypoint 앵커 참조
    depends_on:
      - spark-master
    env_file:
      - .env.spark
    environment:
      # 워커 노드의 Spark 설정 (마스터 노드와 동일)
      - SPARK_RPC_IO_THREADS=16
      - SPARK_NETWORK_IO_THREADS=16
      - SPARK_RPC_MESSAGE_MAX_SIZE=256
      - SPARK_NETWORK_MAX_RETRIES=3
      - SPARK_LOCAL_DIR=/tmp/spark-temp
      # 워커 노드의 리소스 설정
      - SPARK_WORKER_CORES=4        # 워커당 사용할 CPU 코어 수
      - SPARK_WORKER_MEMORY=4g      # 워커당 사용할 메모리
      - SPARK_WORKER_INSTANCES=1    # 워커 프로세스 인스턴스 수
      - SPARK_DAEMON_MEMORY=1g      # 워커 데몬 프로세스의 메모리
    volumes:
      - ./book_data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
      - spark-logs:/opt/spark/spark-events
    networks:
      - minio_network
    deploy:  # 컨테이너 리소스 제한
      resources:
        limits:
          cpus: '4'    # CPU 제한
          memory: 5G   # 메모리 제한 (데몬 메모리 포함)
        reservations:
          cpus: '2'    # 최소 보장 CPU
          memory: 2G   # 최소 보장 메모리
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  spark-logs:  # Spark 이벤트 로그를 위한 영구 볼륨

networks:
  minio_network:
    external: true
services:
  minio1:
    image: quay.io/minio/minio
    container_name: minio1
    restart: always
    hostname: minio1
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --address ":9000" --console-address ":9001" /data/data{1...2}
    volumes:
      - minio1-data1:/data/data1
      - minio1-data2:/data/data2
    networks:
      - minio_network

  minio2:
    image: quay.io/minio/minio
    container_name: minio2
    restart: always
    hostname: minio2
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server --address ":9000" --console-address ":9001" /data/data{1...2}
    volumes:
      - minio2-data1:/data/data1
      - minio2-data2:/data/data2
    networks:
      - minio_network

networks:
  minio_network:
    driver: bridge

volumes:
  minio1-data1:
  minio1-data2:
  minio2-data1:
  minio2-data2:

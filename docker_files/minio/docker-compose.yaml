services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
      MINIO_REGION: us-east-1
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_SERVER_URL: "http://minio:9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    # networks:
    #   - kind
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # MinIO Client for administration
  mc:
    image: quay.io/minio/mc:latest
    container_name: mc
    depends_on:
      - minio
    environment:
      MC_HOST_minio1: http://admin:admin1234@minio:9000
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
      until (mc admin info minio) do echo 'Waiting for MinIO to be ready...' && sleep 1; done;
      mc admin info minio;
      exit 0;
      "
    # networks:
    #   - kind

networks:
  minio_network:
    driver: bridge
    name: minio_network
  # kind:
    # external: true

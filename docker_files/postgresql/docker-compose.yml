services:
  # postgresql:
  #   image: postgres:15
  #   restart: always
  #   container_name: postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: root
  #     POSTGRES_PASSWORD: admin1234
  #   volumes:
  #     - ./data/postgres/:/var/lib/postgresql/data
  postgres18:
    image: postgres:18.6
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "4"
          memory: 4G
    volumes:
      - ./data/postgres18/:/var/lib/postgresql/18/docker
      # - pgdata18:/var/lib/postgresql
    ports:
      - "5432:5432"

  # volumes:
  # pgdata18:

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    container_name: pgadmin4
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin1234
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 2G
    volumes:
      - ./data/pgadmin/:/var/lib/pgadmin

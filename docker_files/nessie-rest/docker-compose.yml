services:
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    env_file:
      - .env
    environment:
      # - nessie.version.store.type=IN_MEMORY
      - nessie.version.store.type=JDBC
      - quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/nessie
      - quarkus.datasource.username=nessie
      - quarkus.datasource.password=nessie
      - nessie.catalog.default-warehouse=silver
      - nessie.catalog.warehouses.silver.location=s3a://silver
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.auth-type=STATIC
      - nessie.catalog.secrets.access-key.name=${MINIO_ACCESS_KEY}
      - nessie.catalog.secrets.access-key.secret=${MINIO_SECRET_KEY}
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.server.authentication.enabled=false

  dremio:
    image: dremio/dremio-oss:latest
    container_name: dremio
    hostname: dremio
    restart: unless-stopped
    volumes:
      - dremio-data:/opt/dremio/data
    ports:
      - "9047:9047"
      - "31010:31010"
      - "32010:32010"
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: "-Dpaths.dist=file:///opt/dremio/data/dist"


  postgres:
    image: postgres:latest
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - minio_network


  db-init:
    image: postgres:latest
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_DB: $POSTGRES_DB
    networks:
      - minio_network
    command: >
      sh -c "
        until pg_isready -h $POSTGRES_HOST -p 5432; do
          echo 'Waiting for PostgreSQL to become ready...'
          sleep 1
        done;
        echo 'PostgreSQL is ready. Executing init script.';
        echo \"GRANT ALL PRIVILEGES ON DATABASE $POSTGRES_DB TO $POSTGRES_USER;\" | \
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB
      "

volumes:
  dremio-data:

  postgres:
    image: postgres:latest
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rest_catalog
      POSTGRES_USER: rest_catalog
      POSTGRES_PASSWORD: rest_catalog
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - minio_network


  db-init:
    image: postgres:latest
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: "rest_catalog"
      POSTGRES_PASSWORD: "rest_catalog"
      POSTGRES_HOST: "postgres"
      POSTGRES_DB: "rest_catalog"
    networks:
      - minio_network
    command: >
      sh -c "
        until pg_isready -h $POSTGRES_HOST -p 5432; do
          echo 'Waiting for PostgreSQL to become ready...'
          sleep 1
        done;
        echo 'PostgreSQL is ready. Executing init script.';
        echo \"GRANT ALL PRIVILEGES ON DATABASE $POSTGRES_DB TO $POSTGRES_USER;\" | \
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB
      "

volumes:
  dremio-data:

networks:
  minio_network:
    driver: bridge
